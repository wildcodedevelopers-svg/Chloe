<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Make a Wish - Chloe</title>
<style>
html,body{margin:0;height:100%;background:#03040d;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{display:block}
</style></head><body>
<canvas id="c"></canvas>
<script>
// compatibility: older phones lack roundRect; show any error on screen so it can be reported
if(!CanvasRenderingContext2D.prototype.roundRect)CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
  r=Math.min(Array.isArray(r)?r[0]:r||0,w/2,h/2);this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath()};
addEventListener('error',e=>{let d=document.getElementById('err');if(!d){d=document.createElement('div');d.id='err';
  d.style.cssText='position:fixed;left:8px;right:8px;top:8px;z-index:9;background:#300;color:#fff;font:12px monospace;padding:8px;border-radius:6px;word-break:break-all';document.body.appendChild(d)}
  d.textContent='Error: '+e.message+' (line '+e.lineno+')'});
const NAME='CHLOE';                 // <- change the name here
const FROM='Wayne';                 // <- who it's from
const ROLE=['your ex-husband and friend,','the father of your child & your brother'];   // <- how he signs off (edit or clear with [])
const MESSAGES=[                    // <- edit the birthday messages here
  ['Wishing you a year filled with','love, laughter and joy.'],
  ['Thank you for the memories,','the laughs and the lessons.'],
  ['May every dream you carry','come true this year.'],
  ['You are loved, you are special,','and today is all about you.'],
  ['I hope this year brings you','everything your heart wishes for.'],
  ['Happy birthday, '+NAME[0]+NAME.slice(1).toLowerCase()+'!','Enjoy every single moment.'],
  ...(FROM?[['With all my love,',FROM,...ROLE]]:[])
];

const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=0,H=0,dpr=1;
const GOLD='#d6b260',IVORY='#f6edd9',SERIF="Georgia,'Times New Roman',serif";
const SPARK=['#ffd06e','#fff4e1','#ffaa96','#aacdff','#ff9638','#f5dea0'];
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v;
const easeOut=t=>1-Math.pow(1-clamp(t),3);
const smooth=t=>{t=clamp(t);return t*t*(3-2*t)};

/* ---------- state ---------- */
let state='title',st=0,T=0,holding=false,wind=0,hint='',hintT=0,msgI=0,msgT=0,canReplay=false;
const N_CANDLES=9;
let flame=[],smoke=[],stars=[],rockets=[],sparks=[],confetti=[],gl=[],blowAt=0;
function reset(){
  flame=Array.from({length:N_CANDLES},()=>1);smoke=[];rockets=[];sparks=[];confetti=[];
  wind=0;holding=false;msgI=0;msgT=0;canReplay=false;
}
function go(s){state=s;st=T}
function resize(){
  dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  stars=Array.from({length:Math.round(W*H/2800)},()=>({x:rnd(0,W),y:rnd(0,H),r:rnd(.4,1.5),ph:rnd(0,6.28),sp:rnd(.4,1.6)}));
  gl=Array.from({length:70},()=>({a:rnd(0,1),b:rnd(0,1),p:rnd(0,6.28)}));
}

/* ---------- text helpers ---------- */
function spaced(txt,x,y,size,sp,color,alpha=1,weight='400',style=''){
  ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle=color;ctx.textBaseline='middle';ctx.textAlign='left';
  ctx.font=`${style} ${weight} ${size}px ${SERIF}`;
  let w=0;for(const ch of txt)w+=ctx.measureText(ch).width+sp;w-=sp;
  let cx=x-w/2;for(const ch of txt){ctx.fillText(ch,cx,y);cx+=ctx.measureText(ch).width+sp}
  ctx.restore();return w;
}
function fitSpaced(txt,y,maxw,size,spRatio,color,alpha,weight,style){
  ctx.font=`${style||''} ${weight||'400'} ${size}px ${SERIF}`;
  let w=0;for(const ch of txt)w+=ctx.measureText(ch).width+size*spRatio;
  const k=Math.min(1,maxw/w);
  return spaced(txt,W/2,y,size*k,size*k*spRatio,color,alpha,weight,style);
}
function line(txt,y,size,color,alpha=1,style='italic',weight='400'){
  ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle=color;ctx.textAlign='center';ctx.textBaseline='middle';
  let s=size;ctx.font=`${style} ${weight} ${s}px ${SERIF}`;
  const w=ctx.measureText(txt).width;if(w>W*.9){s*=W*.9/w;ctx.font=`${style} ${weight} ${s}px ${SERIF}`}
  ctx.fillText(txt,W/2,y);ctx.restore();
}

/* ---------- background ---------- */
function drawBG(){
  let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#04061a');g.addColorStop(1,'#02030a');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const boost=state=='celebrate'?1.25:1;
  g=ctx.createRadialGradient(W/2,H*.48,0,W/2,H*.48,Math.max(W,H)*.55);
  g.addColorStop(0,`rgba(32,64,190,${.42*boost})`);g.addColorStop(.5,'rgba(14,28,100,.22)');g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(const s of stars){
    ctx.globalAlpha=.25+.6*(.5+.5*Math.sin(T*s.sp+s.ph));
    ctx.fillStyle='#dfe8ff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill();
  }
  ctx.globalAlpha=1;
}

/* ---------- cake ---------- */
const sprk=Array.from({length:44},()=>({u:Math.random(),v:Math.random(),p:rnd(0,6.28)}));
function geom(){
  const R=Math.min(W*.34,H*.2),rise=state=='title'?1:1-easeOut((T-(state=='intro'?st:-99))/3.2);
  const plateY=H*.7+(state=='intro'?rise*H*.55:state=='title'?H:0);
  const bBase=plateY-R*.05,bH=R*.5,tBase=bBase-bH,tR=R*.62,tH=R*.38,topY=tBase-tH;
  return {R,cx:W/2,plateY,bBase,bH,tBase,tR,tH,topY,tRy:tR*.2};
}
function tier(cx,base,rx,h,band){
  const ry=rx*.2;
  let g=ctx.createLinearGradient(cx-rx,0,cx+rx,0);
  g.addColorStop(0,'#bdb4aa');g.addColorStop(.3,'#fbf4e8');g.addColorStop(.6,'#f1e8d8');g.addColorStop(1,'#a79f98');
  ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(cx-rx,base-h);ctx.lineTo(cx-rx,base);
  ctx.ellipse(cx,base,rx,ry,0,Math.PI,0,true);ctx.lineTo(cx+rx,base-h);ctx.closePath();ctx.fill();
  if(band){
    const y1=base-h*.62,y2=base-h*.34;
    g=ctx.createLinearGradient(cx-rx,0,cx+rx,0);g.addColorStop(0,'#10194a');g.addColorStop(.35,'#2b3f9a');g.addColorStop(1,'#0b1238');
    ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(cx-rx,y1);ctx.lineTo(cx-rx,y2);
    ctx.ellipse(cx,y2,rx,ry,0,Math.PI,0,true);ctx.lineTo(cx+rx,y1);ctx.ellipse(cx,y1,rx,ry,0,0,Math.PI,false);ctx.closePath();ctx.fill();
    ctx.strokeStyle=GOLD;ctx.lineWidth=Math.max(1,rx*.012);
    for(const y of [y1,y2]){ctx.beginPath();ctx.ellipse(cx,y,rx,ry,0,0,Math.PI);ctx.stroke()}
  }
  // glitter
  for(const s of sprk){
    const x=cx-rx*.95+s.u*rx*1.9,y=base-h*.9+s.v*h*.8+Math.sqrt(Math.max(0,1-Math.pow((x-cx)/rx,2)))*ry;
    if(band&&y<base-h*.28&&y>base-h*.68)continue;
    ctx.globalAlpha=.35+.5*Math.sin(T*2+s.p)**2;ctx.fillStyle='#e8c46c';ctx.fillRect(x,y,1.6,1.6);
  }
  ctx.globalAlpha=1;
  // top surface
  const top=base-h;
  g=ctx.createRadialGradient(cx-rx*.2,top-ry*.2,0,cx,top,rx);g.addColorStop(0,'#fffaf0');g.addColorStop(1,'#e3d8c4');
  ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(cx,top,rx,ry,0,0,7);ctx.fill();
  ctx.strokeStyle='rgba(214,178,96,.8)';ctx.lineWidth=Math.max(1,rx*.01);ctx.stroke();
  // scalloped pearls on front edge
  const n=Math.round(rx/7);
  for(let k=0;k<=n;k++){const a=k/n*Math.PI,x=cx+Math.cos(a)*rx,y=top+Math.sin(a)*ry;
    ctx.fillStyle='#f8efdc';ctx.strokeStyle='rgba(214,178,96,.7)';ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(x,y+rx*.02,rx*.032,0,7);ctx.fill();ctx.stroke()}
}
function plate(g_){
  const {cx,plateY,R}=g_,rx=R*1.25,ry=rx*.19;
  ctx.fillStyle='#8f6f2e';ctx.beginPath();ctx.ellipse(cx,plateY+R*.035,rx,ry,0,0,7);ctx.fill();
  let g=ctx.createLinearGradient(cx-rx,0,cx+rx,0);g.addColorStop(0,'#a8843a');g.addColorStop(.4,'#f1d890');g.addColorStop(1,'#8c6a2a');
  ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(cx,plateY,rx,ry,0,0,7);ctx.fill();
  ctx.fillStyle='#e0c27a';ctx.beginPath();ctx.ellipse(cx,plateY-1,rx*.92,ry*.86,0,0,7);ctx.fill();
}
function candlePos(g_){
  return Array.from({length:N_CANDLES},(_,i)=>{
    const a=i/N_CANDLES*Math.PI*2+.3;
    return {i,x:g_.cx+Math.cos(a)*g_.tR*.72,y:g_.topY+Math.sin(a)*g_.tRy*.72,h:g_.R*.3};
  }).sort((a,b)=>a.y-b.y);
}
function drawCandle(c,g_){
  const w=g_.R*.045,top=c.y-c.h;
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(c.x,c.y,w*.9,w*.35,0,0,7);ctx.fill();
  const cols=['#ffe9c2','#9fc2ff','#ffc7c0'];
  ctx.fillStyle=cols[c.i%3];ctx.fillRect(c.x-w/2,top,w,c.h);
  ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(c.x-w/2,top,w*.3,c.h);
  ctx.fillStyle='rgba(20,30,90,.45)';for(let y=top+w;y<c.y;y+=w*1.8)ctx.fillRect(c.x-w/2,y,w,w*.5);
  const f=flame[c.i];if(f<=.01)return;
  const lean=wind*g_.R*.09*(.6+.4*Math.sin(T*18+c.i*2))+Math.sin(T*9+c.i)*g_.R*.008;
  const fh=g_.R*.13*f*(1-wind*.25),fw=g_.R*.034*f,fx=c.x,fy=top-w*.2;
  ctx.save();ctx.globalCompositeOperation='lighter';
  let g=ctx.createRadialGradient(fx+lean*.4,fy-fh*.5,0,fx+lean*.4,fy-fh*.5,g_.R*.28*f);
  g.addColorStop(0,'rgba(255,170,70,.45)');g.addColorStop(1,'rgba(255,150,40,0)');
  ctx.fillStyle=g;ctx.fillRect(fx-g_.R*.4,fy-g_.R*.5,g_.R*.8,g_.R*.8);ctx.restore();
  const drawF=(k,col)=>{ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(fx,fy);
    ctx.bezierCurveTo(fx-fw*k,fy-fh*.3*k,fx-fw*.5*k+lean*.3,fy-fh*.8*k,fx+lean*k,fy-fh*k);
    ctx.bezierCurveTo(fx+fw*.5*k+lean*.3,fy-fh*.8*k,fx+fw*k,fy-fh*.3*k,fx,fy);ctx.fill()};
  drawF(1,'#ff9a2e');drawF(.72,'#ffd66b');drawF(.4,'#fffbe8');
}

/* ---------- effects ---------- */
function burst(x,y){
  const col=SPARK[Math.random()*SPARK.length|0],col2=SPARK[Math.random()*SPARK.length|0],n=70;
  for(let i=0;i<n;i++){const a=i/n*6.283+rnd(-.05,.05),v=rnd(1.5,5.2)*(W/390);
    sparks.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,d:rnd(.008,.016),c:i%3?col:col2,s:rnd(1.2,2.6)})}
}
function updateFX(dt){
  if(state=='celebrate'){
    if(Math.random()<dt*2.4)rockets.push({x:rnd(W*.12,W*.88),y:H,vy:-rnd(9,13)*(H/800),ty:rnd(H*.08,H*.34)});
    if(Math.random()<dt*14)confetti.push({x:rnd(0,W),y:-10,vy:rnd(40,90),vx:rnd(-20,20),r:rnd(0,6),vr:rnd(-4,4),w:rnd(4,8),h:rnd(6,12),c:SPARK[Math.random()*6|0]});
  }
  for(const r of rockets){r.y+=r.vy*dt*60*.5;if(r.y<=r.ty){r.dead=1;burst(r.x,r.y)}
    sparks.push({x:r.x,y:r.y,vx:rnd(-.2,.2),vy:rnd(.2,.8),life:.6,d:.03,c:'#ffe7b0',s:1.2})}
  rockets=rockets.filter(r=>!r.dead);
  for(const s of sparks){s.x+=s.vx*dt*60;s.y+=s.vy*dt*60;s.vy+=.05*dt*60;s.vx*=.992;s.life-=s.d*dt*60}
  sparks=sparks.filter(s=>s.life>0);
  for(const c of confetti){c.y+=c.vy*dt;c.x+=c.vx*dt+Math.sin(T*2+c.r)*.4;c.r+=c.vr*dt}
  confetti=confetti.filter(c=>c.y<H+20);
  for(const s of smoke){s.x+=s.vx*dt;s.y+=s.vy*dt;s.r+=dt*8;s.a-=dt*.35}
  smoke=smoke.filter(s=>s.a>0);
}
function drawFX(){
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const s of sparks){ctx.globalAlpha=clamp(s.life);ctx.fillStyle=s.c;ctx.beginPath();ctx.arc(s.x,s.y,s.s,0,7);ctx.fill()}
  for(const r of rockets){ctx.globalAlpha=1;ctx.fillStyle='#fff';ctx.fillRect(r.x-1,r.y,2,8)}
  ctx.restore();ctx.globalAlpha=1;
  for(const c of confetti){ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.r);ctx.globalAlpha=.85;ctx.fillStyle=c.c;ctx.fillRect(-c.w/2,-c.h/2,c.w,c.h*Math.abs(Math.cos(c.r*1.3)));ctx.restore()}
  for(const s of smoke){ctx.globalAlpha=clamp(s.a)*.5;ctx.fillStyle='#9aa4c8';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill()}
  ctx.globalAlpha=1;
}
function drawWind(g_){
  if(wind<.02)return;
  ctx.save();ctx.globalCompositeOperation='lighter';ctx.strokeStyle='#bcd2ff';ctx.lineCap='round';
  for(let i=0;i<14;i++){
    const p=((T*(.8+i%4*.25)+i*.37)%1),y=g_.topY-g_.R*.45+((i*53)%100)/100*g_.R*.9,x=-W*.1+p*W*1.2;
    ctx.globalAlpha=wind*.35*Math.sin(p*Math.PI);ctx.lineWidth=1.2;
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+40+wind*50,y+Math.sin(p*9+i)*4);ctx.stroke();
  }
  ctx.restore();
}
function drawMeter(){
  const w=Math.min(W*.5,220),x=(W-w)/2,y=H*.9;
  ctx.globalAlpha=.9;ctx.fillStyle='rgba(255,255,255,.12)';ctx.beginPath();ctx.roundRect(x,y,w,5,3);ctx.fill();
  ctx.fillStyle=wind>=1?'#fff1bd':GOLD;ctx.beginPath();ctx.roundRect(x,y,Math.max(0,w*wind),5,3);ctx.fill();ctx.globalAlpha=1;
}

/* ---------- logic ---------- */
function blow(){
  hint='';for(let i=0;i<N_CANDLES;i++)setTimeout(()=>{
    flame[i]=0;const g_=geom(),c=candlePos(g_).find(k=>k.i==i);
    for(let k=0;k<5;k++)smoke.push({x:c.x+rnd(-3,3),y:c.y-c.h-6,vx:rnd(-8,8)+wind*20,vy:-rnd(25,50),r:rnd(2,4),a:rnd(.6,1)});
  },i*130+rnd(0,80));
  blowAt=T;go('blown');
}
function down(){
  if(state=='title'){reset();go('intro')}
  else if(state=='intro'&&T-st>1.6){st=T-3.4}
  else if(state=='wish'){holding=true}
  else if(state=='celebrate'&&canReplay){reset();go('intro')}
}
function up(){
  if(state!='wish'||!holding)return;holding=false;
  if(wind>=.95)blow();else{hint='Hold a little longer, and wish with all your heart...';hintT=T}
}
function update(dt){
  if(state=='intro'&&T-st>4.6)go('wish');
  if(state=='wish'){
    wind=clamp(wind+(holding?dt/2.4:-dt*1.2));
  }
  if(state=='blown'){wind=clamp(wind-dt*.5);if(T-blowAt>3.2)go('celebrate')}
  if(state=='celebrate'){
    wind=0;msgT+=dt;
    if(msgT>5.2){msgT=0;msgI=(msgI+1)%MESSAGES.length}
    if(T-st>7)canReplay=true;
  }
  updateFX(dt);
}

/* ---------- draw ---------- */
function draw(){
  drawBG();
  const tt=T-st;
  if(state=='title'){
    const a=smooth(tt/1.6),sz=Math.min(W*.115,56);
    fitSpaced('MAKE A WISH',H*.42,W*.88,sz,.18,GOLD,a,'600');
    line('an interactive birthday surprise',H*.42+sz*1.2,Math.min(W*.043,19),'#9fb2e6',a*.85);
    line('Tap to begin',H*.62,Math.min(W*.04,17),'#c9d5ff',(.4+.4*Math.sin(T*2.4))*smooth((tt-1.5)/1));
    return;
  }
  const g_=geom();
  plate(g_);
  ctx.fillStyle='rgba(0,0,0,.18)';
  tier(g_.cx,g_.bBase,g_.R,g_.bH,true);
  tier(g_.cx,g_.tBase,g_.tR,g_.tH,false);
  for(const c of candlePos(g_))drawCandle(c,g_);
  drawWind(g_);
  drawFX();
  const fs=Math.min(W*.05,22);
  if(state=='intro'){
    line('Someone special is celebrating today...',H*.14,fs,'#aebce8',smooth((tt-.4)/1.4)*(1-smooth((tt-3.8)/.7)));
  }
  if(state=='wish'){
    const a=smooth((tt-.2)/.8);
    line(holding?(wind>=1?'Now release to blow out the candles':'Keep holding... think of your wish'):NAME[0]+NAME.slice(1).toLowerCase()+', hold the screen and make a wish',H*.14,fs,'#e8d9a8',a);
    if(!holding&&hint&&T-hintT<3.5)line(hint,H*.2,fs*.8,'#9fb2e6',1-clamp((T-hintT-2.5)));
    if(!holding)line('press and hold',H*.88,fs*.75,'#c9d5ff',(.35+.35*Math.sin(T*2.4))*a);
    drawMeter();
  }
  if(state=='blown'||state=='celebrate'){
    const a=state=='celebrate'?smooth(tt/1.4):0;
    if(state=='blown')line('Your wish is on its way...',H*.14,fs,'#e8d9a8',smooth((T-blowAt)/1)*(1-smooth((T-blowAt-2)/1)));
    if(a>0){
      const hb=Math.min(W*.075,34),ns=Math.min(W*.19,86),y1=H*.085,yN=y1+hb*.5+ns*.66;
      fitSpaced('HAPPY BIRTHDAY',y1,W*.86,hb,.2,GOLD,a,'600');
      ctx.save();ctx.shadowColor='rgba(255,208,110,.8)';ctx.shadowBlur=24;
      fitSpaced(NAME,yN,W*.86,ns,.14,'#fff4d6',a,'700');ctx.restore();
      const m=MESSAGES[msgI],f=smooth(msgT/.9)*(1-smooth((msgT-4.3)/.9)),y=yN+ns*.62+fs*1.2;
      const signed=FROM&&msgI==MESSAGES.length-1;
      m.forEach((l,i)=>{
        if(signed){const yy=y+[0,2.2,4.4,5.9][i]*fs;
          if(i==1){ctx.save();ctx.shadowColor='rgba(255,208,110,.8)';ctx.shadowBlur=20;line(l,yy,fs*2.2,'#fff4d6',f*a,'normal','700');ctx.restore()}
          else line(l,yy,fs*(i==0?1.1:.95),i==0?GOLD:'#dfe6ff',f*a)}
        else line(l,y+i*fs*1.5,fs*1.05,'#dfe6ff',f*a)});
      if(canReplay)line('tap to replay',H*.94,fs*.7,'#9fb2e6',.35+.3*Math.sin(T*2.4));
    }
  }
}

let last=performance.now();
function loop(now){
  if(innerWidth!=W||innerHeight!=H)resize();
  const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
  requestAnimationFrame(loop);update(dt);draw();
}
addEventListener('pointerdown',e=>{e.preventDefault();down()});
addEventListener('pointerup',up);addEventListener('pointercancel',up);
addEventListener('keydown',e=>{if(e.repeat)return;if(e.code=='Space'||e.code=='Enter'){e.preventDefault();down()}if(e.code=='KeyR'){reset();go('title')}});
addEventListener('keyup',e=>{if(e.code=='Space')up()});
resize();reset();requestAnimationFrame(loop);
</script></body></html>
